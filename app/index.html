<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genshin Scampact</title>

    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="appContainer">
        <div class="hiddenbar">
            <span>If you find this, well done.</span>
        </div>

        <header>
            <div>
                <h1 class="lyneyTitle"><i>Lyney</i> 5*</h1>
                <p class="notAlert">P. <span id="primosDisplay"></span></p>
            </div>
        </header>

        <section>
            <div>
                <img src="images/Banner Section.png" alt="">
                <h2>Characters</h2>
                <div class="spanHolder">
                    <div class="charSpans">
                        <span id="lyneySpan">Lyney *5</span>
                        <span id="lynetteSpan">Lynette *4</span>
                        <span id="sucroseSpan">Sucrose *4</span>
                        <span id="bennettSpan">Bennett *4</span>
                        <span id="weaponSpan">Weapon *3</span>
                    </div>
                </div>
            </div>
            <h2 class="pityBum">Pity: <span id="pityDisplay"></span></h2>
        </section>

        <footer>
            <div class="wishBtns">
                <button onclick="eventUh()" class="nonAlert">EVENT</button>
                <button onclick="singlePull()" class="nonAlert">WISH x1</button>
                <button onclick="multiPull()" class="nonAlert">WISH x10</button>
            </div>
        </footer>

        <div class="alerts" id="alertOverlay">
            <div class="alert" id="eventAlert">
                <h2>Event</h2>
                <p>You did an event and gained <span id="primoGain"></span> primogems!</p>
                <button onclick="closeAlert()">Close</button>
            </div>

            <div class="alert" id="wishAlert">
                <h2>Wish x<span></span></h2>
                <p>You wished and got <span id="obtainedChar"></span></p>
                <button onclick="closeAlert()">Close</button>
            </div>

            <div class="alert" id="brokeAlert">
                <h2>Insufficent Primos</h2>
                <p>Uh oh! You are out of primogems! Do an event?</p>
                <div>
                    <button onclick="event()">Yes</button>
                    <button onclick="closeAlert()">No</button>
                </div>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
