<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genshin Scampact</title>

    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>
<body>
    
    <div class="hiddenbar">
        <span>If you find this, well done.</span>
    </div>

    <header>
        <div>
            <h1><i>Lyney</i> 5*</h1>
            <p>P. <span id="primos">{total}</span></p>
        </div>
    </header>

    <section>
        <div>
            <div>
                <span id="lyneySpan">Lyney *5</span>
                <span id="lynetteSpan">Lynette *4</span>
                <span id="sucroseSpan">Sucrose *4</span>
                <span id="bennettSpan">Bennett *4</span>
                <span id="weaponSpan">Weapon *3</span>
            </div>
            <h2>Pity: <span id="pity">{null}</span></h2>
        </div>
    </section>

    <footer>
        <div>
            <button id="eventBtn" onclick="event()">EVENT</button>
            <button id="wishx1Btn" onclick="singlePull()">WISH x1</button>
            <button id="wishx10Btn" onclick="multiPull()">WISH x10</button>
        </div>
    </footer>

</body>
</html>
